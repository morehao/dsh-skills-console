<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能管理 · 界面原型 v10（2026-10-23）</title>
<!--
  技能管理（@morehao/dsh-skills-manager）界面原型 v10
  - 设计：../specs/2026-10-23-dsh-skills-manager-prototype-design.md
  - 单文件、零依赖、离线可开；数据在底部 MOCK，改数字即可看布局
  - 主题令牌在宿主内由 DSH 提供（--dsw-alias-*），这里只是离线兜底
-->
<style>
  :root {
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --focus: 2px solid #4c8dff;
  }
  [data-theme="dark"] {
    --bg-app:#0f1012; --bg-1:#17181b; --bg-2:#1d1f23; --bg-3:#24262b; --hover:rgba(255,255,255,.06);
    --bd-1:#26282d; --bd-2:#33363c; --bd-3:#454a52;
    --tx-1:#ededed; --tx-2:#b9b9b9; --tx-3:#8b8f96;
    --ok:#51b976; --info:#6aa4ff; --warn:#d49245; --err:#ef7272;
    --shadow:0 12px 40px rgba(0,0,0,.55);
  }
  [data-theme="light"] {
    --bg-app:#f6f7f9; --bg-1:#fff; --bg-2:#f2f3f5; --bg-3:#e9ebee; --hover:rgba(0,0,0,.045);
    --bd-1:#e6e8eb; --bd-2:#d8dbe0; --bd-3:#c2c7ce;
    --tx-1:#1b1d21; --tx-2:#4c5158; --tx-3:#767c85;
    --ok:#1f9d55; --info:#2f6fe4; --warn:#a86a17; --err:#c93b3b;
    --shadow:0 12px 32px rgba(15,20,30,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-app);color:var(--tx-1)}
  button{font:inherit;color:inherit}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

  /* 原型外壳（真实插件里没有） */
  .harness{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:9px 16px;background:var(--bg-1);border-bottom:1px solid var(--bd-2)}
  .harness .tag{font-size:11px;color:var(--tx-3);border:1px dashed var(--bd-3);border-radius:999px;padding:2px 8px}
  .harness select{background:var(--bg-2);color:var(--tx-1);border:1px solid var(--bd-2);border-radius:var(--radius-sm);padding:4px 8px;font-size:12px}
  .spacer{flex:1 1 auto}

  .wrap{max-width:980px;margin:0 auto;padding:20px}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--radius-sm);
    border:1px solid var(--bd-2);background:var(--bg-2);color:var(--tx-1);cursor:pointer;font-size:12px;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--hover)}
  .btn:focus-visible{outline:var(--focus);outline-offset:2px}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn-primary{background:var(--info);border-color:transparent;color:#fff;font-weight:600}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn-danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:transparent}
  .btn-danger:hover:not(:disabled){background:color-mix(in srgb,var(--err) 12%,transparent)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
  .btn-ghost:hover:not(:disabled){color:var(--tx-1);background:var(--hover)}

  .banner{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:var(--radius-md);font-size:12px;margin-bottom:12px}
  .banner.err{background:color-mix(in srgb,var(--err) 14%,transparent);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
  .banner.muted{background:var(--bg-2);border:1px solid var(--bd-2);color:var(--tx-2)}
  .banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
  /* 「？」帮助按钮 + 悬浮提示 */
  .tip{position:relative;display:inline-flex;flex:none}
  .tip > .q{width:18px;height:18px;border-radius:50%;border:1px solid var(--bd-3);background:transparent;
    color:var(--tx-2);font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:help;padding:0}
  .tip > .q:hover,.tip > .q:focus-visible{color:var(--tx-1);border-color:var(--tx-3);outline:none}
  .tipbox{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:max-content;max-width:360px;
    background:var(--bg-3);border:1px solid var(--bd-3);border-radius:var(--radius-md);box-shadow:var(--shadow);
    padding:10px 12px;font-size:11.5px;line-height:1.65;color:var(--tx-2);
    opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s ease,transform .12s ease}
  .tip:hover .tipbox,.tip:focus-within .tipbox{opacity:1;visibility:visible;transform:none}
  .tipbox b{color:var(--tx-1)}
  .tipbox .cmd{display:flex;align-items:center;gap:8px;margin-top:6px;background:var(--bg-2);
    border:1px solid var(--bd-1);border-radius:6px;padding:5px 8px;font-family:ui-monospace,monospace;color:var(--tx-1)}

  .page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .page-head h1{font-size:17px;margin:0;letter-spacing:-.2px}
  .page-head .actions{margin-left:auto;display:flex;gap:8px}

  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--bd-1)}
  .tabs button{border:0;background:transparent;color:var(--tx-3);padding:8px 12px;cursor:pointer;
    font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
  .tabs button:hover{color:var(--tx-1);background:var(--hover)}
  .tabs button[aria-selected="true"]{color:var(--tx-1);font-weight:650;border-bottom-color:var(--info)}
  .tabs button:focus-visible{outline:var(--focus);outline-offset:-2px}
  .section{margin-bottom:20px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .section-head h2{font-size:12.5px;margin:0;color:var(--tx-2);font-weight:600}
  .section-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .section-head .hint{color:var(--tx-3);font-size:11.5px}

  .list{background:var(--bg-1);border:1px solid var(--bd-1);border-radius:var(--radius-lg);overflow:hidden}
  .item{padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
  .item.off{opacity:.55}
  .item.off:hover{opacity:.75}
  .off-note{color:var(--warn)!important}

  /* 行首启停开关 */
  .switch{display:inline-flex;align-items:center;cursor:pointer;flex:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{width:30px;height:17px;border-radius:999px;background:var(--bd-3);position:relative;
    transition:background .14s ease;display:inline-block}
  .switch .knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;
    transition:transform .14s ease}
  .switch input:checked + .track{background:var(--ok)}
  .switch input:checked + .track .knob{transform:translateX(13px)}
  .switch input:focus-visible + .track{outline:var(--focus);outline-offset:2px}
  .switch input:disabled + .track{opacity:.5}

  /* 文字链（不是按钮） */
  .linklike{border:0;background:transparent;color:var(--info);cursor:pointer;font-size:11.5px;padding:0 2px}
  .linklike:hover{text-decoration:underline}
  .linklike:focus-visible{outline:var(--focus);outline-offset:1px;border-radius:3px}

  /* 底部默认链接设置行 */
  /* 页头「自动链接」设置控件（不是主按钮） */
  .setchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd-2);background:var(--bg-2);
    color:var(--tx-2);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer}
  .setchip:hover{background:var(--hover);color:var(--tx-1)}
  .setchip:focus-visible{outline:var(--focus);outline-offset:2px}
  .setchip b{color:var(--tx-1);font-weight:600}
  .setchip .caret{color:var(--tx-3);font-size:10px}
  .item+.item{border-top:1px solid var(--bd-1)}
  .item:hover{background:var(--hover)}
  .item .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .item .meta{color:var(--tx-3);font-size:11.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .item .ops{display:flex;gap:6px;flex:none;align-items:center}
  .item .ops .switch{margin-right:4px;padding-right:10px;border-right:1px solid var(--bd-1)}
  .group-head{padding:9px 14px;font-size:11.5px;color:var(--tx-3);background:var(--bg-2);border-top:1px solid var(--bd-1)}
  .group-head + .item{border-top:0}
  .viewswitch{display:flex;align-items:center;gap:6px;color:var(--tx-3);font-size:11.5px}
  .viewswitch .seg button{padding:2px 9px;font-size:11px}

  .tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--bd-2);color:var(--tx-2);white-space:nowrap;font-weight:500}
  .tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
  .tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .tag.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}

  .sub .item{cursor:pointer}
  .sub .chev{display:inline-block;width:12px;color:var(--tx-3);transition:transform .15s ease}
  .sub.open .chev{transform:rotate(90deg)}
  .sub-skills{background:var(--bg-2);border-top:1px solid var(--bd-1);padding:4px 14px 8px}
  .sub-skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:12.5px}
  .sub-skill+.sub-skill{border-top:1px dashed var(--bd-1)}
  .sub-skill .path{color:var(--tx-3);font-family:ui-monospace,monospace;font-size:10.5px;margin-left:8px}

  /* 弹层 */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50;padding:20px}
  .scrim.open{display:grid}
  .dialog{width:min(460px,95vw);background:var(--bg-1);border:1px solid var(--bd-2);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
  .dialog header{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--bd-1)}
  .dialog header h2{margin:0;font-size:14px}
  .dialog header .btn{margin-left:auto}
  .dialog .body{padding:14px 15px}
  .dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 15px;border-top:1px solid var(--bd-1)}
  .dialog p.note{margin:0 0 12px;color:var(--tx-3);font-size:11.5px;line-height:1.6}
  .dialog .steps{margin:0 0 10px;padding-left:18px;color:var(--tx-2);font-size:12px;line-height:1.85}
  .dialog .steps code{color:var(--tx-1)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--tx-2);margin-bottom:5px}
  .field input{width:100%;background:var(--bg-2);border:1px solid var(--bd-2);border-radius:var(--radius-sm);
    color:var(--tx-1);padding:7px 10px;font-size:12.5px;font-family:ui-monospace,monospace}
  .field input:focus-visible{outline:var(--focus);outline-offset:1px}
  .agent{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px}
  .agent+.agent{border-top:1px dashed var(--bd-1)}
  .agent .dir{margin-left:auto;color:var(--tx-3);font-size:11px;font-family:ui-monospace,monospace}
  .agent.fixed{opacity:.85}
  .agent .tag{margin-left:6px}

  .projbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd-2)}
  .projbox-title{font-size:12px;color:var(--tx-2);margin-bottom:8px;font-weight:600}
  .projbox-row{display:flex;gap:8px;align-items:center}
  .projbox-row select{flex:1 1 auto;min-width:0;background:var(--bg-2);border:1px solid var(--bd-2);border-radius:var(--radius-sm);
    color:var(--tx-1);padding:6px 8px;font-size:12px}
  .projbox .hint{margin-top:8px;display:block}
  .empty{background:var(--bg-1);border:1px solid var(--bd-1);border-radius:var(--radius-lg);padding:38px 20px;text-align:center}
  .empty .t{font-size:14px;font-weight:600;margin-bottom:6px}
  .empty .hint{color:var(--tx-3);font-size:11.5px}

  .toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{background:var(--bg-3);border:1px solid var(--bd-3);border-radius:var(--radius-md);padding:8px 14px;font-size:12px;box-shadow:var(--shadow);max-width:520px}
  .toast.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .toast.err{border-color:color-mix(in srgb,var(--err) 60%,transparent)}
  .toast .act{margin-left:10px;color:var(--info);cursor:pointer;text-decoration:underline;font-size:11.5px}
</style>
</head>
<body>

<div class="harness">
  <span class="tag">原型外壳</span>
  <select id="scenario" aria-label="场景">
    <option value="normal">正常</option>
    <option value="empty">空态（无技能无订阅）</option>
    <option value="nocli">CLI 未安装</option>
    <option value="offline">离线</option>
    <option value="corrupt">状态文件损坏（只读）</option>
  </select>
  <span class="spacer"></span>
  <button class="btn" id="theme">切换主题</button>
</div>

<div class="wrap" id="app"></div>

<!-- 通用弹层 -->
<div class="scrim" id="scrim">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <header>
      <h2 id="dlg-title">—</h2>
      <button class="btn btn-ghost" data-close aria-label="关闭">✕</button>
    </header>
    <div class="body" id="dlg-body"></div>
    <div class="foot" id="dlg-foot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ============================ MOCK ============================ */
const MOCK = {
  // DSH 全局是默认必需（原生 rank 400 根）；fixed 表示不可取消
  agents: [
    { key: "dsh-global", label: "dsh（全局）", dir: "~/.dsh/skills", fixed: true, exists: true },
    { key: "claude", label: "Claude Code", dir: "~/.claude/skills", exists: true },
    { key: "codex", label: "Codex", dir: "~/.codex/skills", exists: true },
    { key: "cursor", label: "Cursor", dir: "~/.cursor/skills", exists: true },
  ],
  // 已登记工作区（只列这些，不接受手输路径）
  projects: [
    { path: "/Users/me/work/proj-a", label: "proj-a" },
    { path: "/Users/me/work/proj-b", label: "proj-b" },
  ],
  settings: { autoLinkTargets: ["claude"] },
  skills: [
    { name: "git-kit", source: "morehao/ai-kit", commit: "a1b2c3d", state: "current", mode: "on", linked: ["dsh-global", "claude"], linkChoices: ["dsh-global", "claude"], scopeProjects: [] },
    { name: "disk-cleanup", source: "morehao/ai-kit", commit: "a1b2c3d", state: "update", from: "a1b2c3d", to: "9f02e1a", mode: "on", linked: ["dsh-global"], linkChoices: ["dsh-global"], scopeProjects: [] },
    { name: "handoff", source: "morehao/ai-kit", commit: "a1b2c3d", state: "modified", mode: "off", linked: [], linkChoices: ["dsh-global"], scopeProjects: [] },
    { name: "pdf-tools", source: "vercel-labs/agent-skills", commit: "77aabb", state: "error", reason: "链接断裂（目标目录已不存在）", mode: "on", linked: ["dsh-global"], linkChoices: ["dsh-global"], scopeProjects: [],
      blockedBy: { agent: "Cursor", dir: "~/.cursor/skills/pdf-tools", kind: "真实目录" } },
    { name: "skill-creator", source: "vercel-labs/agent-skills", commit: "77aabb", state: "current", mode: "on", linked: ["dsh-global", "codex"], linkChoices: ["dsh-global", "codex"], scopeProjects: ["/Users/me/work/proj-a"] },
  ],
  subscriptions: [
    { id: "s1", source: "morehao/ai-kit", ref: "main", skills: [
      { name: "git-kit", state: "installed" },
      { name: "handoff", state: "installed" },
      { name: "disk-cleanup", state: "installed", hasUpdate: true },
      { name: "commit-msg", state: "idle" },
    ]},
    { id: "s2", source: "vercel-labs/agent-skills", ref: "main", skills: [
      { name: "pdf-tools", state: "installed" },
      { name: "skill-creator", state: "installed" },
      { name: "web-design-guidelines", state: "idle" },
    ]},
  ],
};

/* ============================ 状态 ============================ */
const ui = { scenario: "normal", tab: "skills", groupBy: "flat", openSub: null, busy: new Set(), dialog: null };

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// 把 links 里的目标 key 翻成用户认识的 Agent 名；两个 dsh 目标合并显示为「DSH」
const AGENT_LABEL = { "dsh-global": "DSH", claude: "Claude Code", codex: "Codex", cursor: "Cursor" };
const projLabel = (p) => p.split("/").filter(Boolean).pop() || p;
function linkedText(sk) {
  const list = sk.linked || [];
  const others = [...new Set(list.filter((k) => !k.startsWith("project:") && k !== "dsh-global").map((k) => AGENT_LABEL[k] || k))];
  if (sk.mode === "off") {
    return others.length ? `DSH 已停用 · 其他 Agent 仍可用：${others.join("、")}` : "DSH 已停用（无其他 Agent 链接）";
  }
  const projects = (sk.scopeProjects || []).map(projLabel);
  const names = ["DSH", ...others];
  let out = "可用：" + names.join("、");
  if (projects.length) out += `（仅 ${projects.join("、")}）`;
  return out;
}
function guard(what) {
  if (ui.scenario === "nocli") return toast(`无法${what}：未找到 skills CLI`, "err"), false;
  if (ui.scenario === "offline") return toast(`无法${what}：当前离线`, "err"), false;
  if (ui.scenario === "corrupt") return toast(`无法${what}：状态文件损坏，只读中`, "err"), false;
  return true;
}
function toast(msg, kind = "ok", action) {
  const box = $("#toasts");
  const t = document.createElement("div");
  t.className = `toast ${kind}`;
  t.innerHTML = esc(msg) + (action ? `<span class="act" data-toast-act>${esc(action)}</span>` : "");
  box.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ============================ 渲染 ============================ */
function stateTag(s) {
  if (s.state === "current") return `<span class="tag ok">最新</span>`;
  if (s.state === "update") return `<span class="tag info">有新版本</span>`;
  if (s.state === "modified") return `<span class="tag warn">本地已改</span>`;
  return `<span class="tag err">异常</span>`;
}
function stateNote(s) {
  if (s.state === "update") return `<span class="mono">${esc(s.from)} → ${esc(s.to)}</span>`;
  if (s.state === "modified") return `<span>更新会覆盖你的改动</span>`;
  if (s.state === "error") return `<span style="color:var(--err)">${esc(s.reason || "")}</span>`;
  return "";
}

function skillRow(s, extra = "") {
  const busy = ui.busy.has(s.name);
  const off = s.mode === "off";
  const updateLabel = "更新";  // 一个动作一个名字；本地已改时点击后确认
  return `
      <div class="item ${off ? "off" : ""}">
        <div>
          <div class="name">${esc(s.name)} ${stateTag(s)}</div>
          <div class="meta">
            <span>${esc(stateNote(s))}</span>
            <span>来自 ${esc(s.source)}#${esc(s.commit || "")}</span>
            <span>${esc(linkedText(s))}</span>
          </div>
          ${off ? `<div class="meta off-note">停用中：DSH 看不到它，但已链接的 Claude Code 等 Agent 照常可用</div>` : ""}
        </div>
        <div class="ops">
          <label class="switch" title="${off ? "已停用：DSH 看不到它，/name 也调不到；文件与链接未变" : "启用中：模型可以使用"}">
            <input type="checkbox" data-mode="${esc(s.name)}" ${off ? "" : "checked"} ${busy ? "disabled" : ""}>
            <span class="track"><span class="knob"></span></span>
          </label>
          <button class="btn" data-update="${esc(s.name)}" ${busy || s.state === "current" ? "disabled" : ""}>
            ${busy ? "更新中…" : updateLabel}
          </button>
          <button class="btn" data-link="${esc(s.name)}" title="改链接到哪些 Agent / 作用范围" ${busy ? "disabled" : ""}>接入设置</button>
          <button class="btn btn-danger" data-del="${esc(s.name)}" ${busy ? "disabled" : ""}>删除</button>
        </div>
      </div>`;
}

/* 按 Agent 分组：组序固定，技能多链接时会在多个组各出现一次 */
function groupedSkills() {
  // DSH 恒可见：第一组是全部技能
  const groups = [{ key: "dsh", label: "DSH（全局链 · 已启用）", items: MOCK.skills.filter((s) => s.mode === "on" && !(s.scopeProjects || []).length) },
                  { key: "dsh-scoped", label: "DSH（仅特定项目）", items: MOCK.skills.filter((s) => s.mode === "on" && (s.scopeProjects || []).length) },
                  { key: "dsh-off", label: "DSH 已停用", items: MOCK.skills.filter((s) => s.mode === "off") }];
  const order = MOCK.agents.filter((a) => a.exists && !a.fixed);  // dsh 另有专门的三个组
  for (const a of order) groups.push({ key: a.key, label: a.label, items: MOCK.skills.filter((s) => (s.linked || []).includes(a.key)) });
  // 每个被用到的项目各成一组
  const projKeys = [...new Set(MOCK.skills.flatMap((s) => (s.linked || []).filter((k) => k.startsWith("project:"))))];
  for (const k of projKeys) {
    const p = k.slice(8);
    groups.push({ key: k, label: `项目 · ${projLabel(p)}`, items: MOCK.skills.filter((s) => s.linked.includes(k)) });
  }
  return groups.filter((g) => g.items.length > 0);
}

function renderSkills() {
  const rows = MOCK.skills.map((s) => {
    return skillRow(s);
  }).join("");
  const updatable = MOCK.skills.filter((s) => s.state === "update" || s.state === "error").length;
  const viewSwitch = `<span class="viewswitch">查看：
      <span class="seg" role="group" aria-label="分组方式">
        <button data-group="flat" aria-pressed="${ui.groupBy === "flat"}">平铺</button>
        <button data-group="agent" aria-pressed="${ui.groupBy === "agent"}">按 Agent</button>
      </span></span>`;
  const body = ui.groupBy === "agent"
    ? groupedSkills().map((g) => `
        <div class="group-head">${esc(g.label)} · ${g.items.length} 个技能</div>
        ${g.items.map((s) => skillRow(s)).join("")}`).join("")
    : rows;
  return `
    <div class="section-head">
      ${updatable ? `<span class="hint">⚠ ${updatable} 个有新版本</span>` : `<span class="hint">全部已是最新</span>`}
      <div class="right">
        ${updatable ? `<button class="btn" data-update-all>全部更新</button>` : ""}
        ${viewSwitch}
      </div>
    </div>
    <div class="list">${body}</div>`;
}

function renderSubs() {
  const rows = MOCK.subscriptions.map((sub) => {
    const open = ui.openSub === sub.id;
    const installed = sub.skills.filter((k) => k.state === "installed").length;
    return `
      <div class="sub ${open ? "open" : ""}">
        <div class="item" data-sub="${esc(sub.id)}">
          <div>
            <div class="name"><span class="chev">▸</span>${esc(sub.source)}</div>
            <div class="meta"><span class="mono">${esc(sub.ref)}</span><span>${sub.skills.length} 个技能 · 已装 ${installed}</span></div>
          </div>
          <div class="ops">
            <button class="btn" data-refresh="${esc(sub.id)}">刷新</button>
            <button class="btn btn-danger" data-del-sub="${esc(sub.id)}">删除</button>
          </div>
        </div>
        ${open ? `<div class="sub-skills">
          ${sub.skills.map((k) => `
            <div class="sub-skill">
              <div>
                ${esc(k.name)}<span class="path">skills/${esc(k.name)}/SKILL.md</span>
                ${k.state === "installed" ? `<span class="tag ok" style="margin-left:8px">已装</span>` : ""}
                ${k.hasUpdate ? `<span class="tag info" style="margin-left:6px">有新版本</span>` : ""}
              </div>
              <div>
                ${k.state === "idle"
                  ? `<button class="btn btn-primary" data-install="${esc(k.name)}">安装</button>`
                  : (k.hasUpdate ? `<button class="btn" data-update="${esc(k.name)}">更新</button>` : `<span class="hint">—</span>`)}
              </div>
            </div>`).join("")}
        </div>` : ""}
      </div>`;
  }).join("");
  return `
    <div class="section-head">
      <h2>订阅（${MOCK.subscriptions.length}）</h2>
      <div class="right"><span class="hint">订阅只记录关注，不安装任何技能；删除订阅不会卸载已装技能</span></div>
    </div>
    <div class="list sub">${rows}</div>`;
}

function render() {
  const app = $("#app");
  const banners = [];
  if (ui.scenario === "nocli") banners.push(`<div class="banner err">
      <span>未找到 <code>skills</code> CLI，安装与更新已禁用；技能列表仍可查看。</span>
      <span class="tip"><button class="q" aria-label="如何安装 CLI" aria-describedby="cli-tip">?</button>
        <span class="tipbox" id="cli-tip" role="tooltip">
          <b>安装 skills CLI</b><br>
          需要 Node.js ≥ 22.20，然后任选一种：<br>
          · 全局安装（推荐，DSH 重启后生效）<br>
          <span class="cmd"><code>npm i -g skills</code><button class="btn" data-copy="npm i -g skills">复制</button></span>
          · 不装也可以，在终端直接用 npx：<br>
          <span class="cmd"><code>npx -y skills add owner/repo</code><button class="btn" data-copy="npx -y skills add owner/repo">复制</button></span>
          装好后重启 DSH，本页会自动恢复写操作。
        </span>
      </span>
    </div>`);
  if (ui.scenario === "offline") banners.push(`<div class="banner muted">当前离线，显示上次快照；写操作已禁用。</div>`);
  if (ui.scenario === "corrupt") banners.push(`<div class="banner warn">状态文件无法解析，已进入只读；修复前不会写入（不会清空你的链接）。</div>`);

  // 页头：设置 chip + 当前 tab 的主按钮（技能 → 添加技能；订阅 → 添加订阅）
  const primaryAction = ui.tab === "subs"
    ? `<button class="btn btn-primary" data-add-sub>添加订阅</button>`
    : `<button class="btn btn-primary" data-add-skill>添加技能</button>`;
  const autoNames = [...new Set(MOCK.settings.autoLinkTargets.map((k) => AGENT_LABEL[k] || k))];
  const autoChip = `<button class="setchip" data-autolink aria-label="设置安装后自动链接到哪些其他 Agent">
      自动链接：<b>${esc(autoNames.join("、") || "不链接其他 Agent")}</b><span class="caret">▾</span>
    </button>`;
  const head = `
    <div class="page-head">
      <h1>技能管理</h1>
      <div class="actions">${autoChip}${primaryAction}</div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="skills" aria-selected="${ui.tab === "skills"}">已装（${MOCK.skills.length}）</button>
      <button role="tab" data-tab="subs" aria-selected="${ui.tab === "subs"}">订阅（${MOCK.subscriptions.length}）</button>
    </div>`;

  // 空态：跟随当前 tab —— 技能 tab 说"没有技能"，订阅 tab 说"没有订阅"
  const isEmpty = ui.scenario === "empty" || (ui.tab === "skills" ? MOCK.skills.length === 0 : MOCK.subscriptions.length === 0);
  if (isEmpty) {
    const isSkills = ui.tab === "skills";
    app.innerHTML = banners.join("") + head + `
      <div class="empty">
        <div class="t">${isSkills ? "还没有安装任何技能" : "还没有添加订阅"}</div>
        <div class="hint" style="margin-bottom:16px">${isSkills
          ? "点右上角「添加技能」即可安装一个；订阅里的技能也能单独安装。"
          : "订阅只是关注一个仓库，不会安装任何技能。添加后可在订阅里逐个安装。"}</div>
        ${isSkills
          ? `<button class="btn btn-primary" data-add-skill>添加技能</button>
             <div class="hint" style="margin-top:18px">也可以直接在终端：<code>npx skills add owner/repo</code></div>`
          : `<button class="btn btn-primary" data-add-sub>添加订阅</button>`}
      </div>`;
    return;
  }

  const panel = ui.tab === "subs" ? renderSubs() : renderSkills();
  app.innerHTML = banners.join("") + head + `<div class="section">${panel}</div>`;
}

/* ============================ 弹层 ============================ */
function openDialog({ title, body, foot }) {
  $("#dlg-title").textContent = title;
  $("#dlg-body").innerHTML = body;
  $("#dlg-foot").innerHTML = foot;
  $("#scrim").classList.add("open");
}
function closeDialog() { $("#scrim").classList.remove("open"); ui.dialog = null; }

/* 默认链接范围：与单技能「接入设置」共用同一套 Agent 复选框语义 */
function dialogAutoLink() {
  const chosen = new Set(MOCK.settings.autoLinkTargets);
  openDialog({
    title: "安装后自动链接到哪些 Agent",
    body: `
      <p class="note"><b>DSH 始终可见</b>，不在下面列表里。这里只决定"顺带链接到哪些其他 Agent"，影响<b>之后所有安装</b>；已有的技能用每行的「接入设置」单独改。</p>
      ${MOCK.agents.filter((a) => a.exists).map((a) => {
        const fixed = a.fixed; // dsh 两个目标恒选
        return `<label class="agent ${fixed ? "fixed" : ""}">
          <input type="checkbox" data-autotarget="${esc(a.key)}" ${chosen.has(a.key) || fixed ? "checked" : ""} ${fixed ? "disabled" : ""}>
          <span>${esc(a.label)}</span>
          ${fixed ? `<span class="tag">必选</span>` : ""}
          <span class="dir">${esc(a.dir)}</span>
        </label>`;
      }).join("")}`,
    foot: `<button class="btn" data-close>取消</button><button class="btn btn-primary" data-do-autolink>保存</button>`,
  });
  $("#dlg-body").onchange = (e) => {
    const k = e.target.dataset.autotarget;
    if (!k) return;
    e.target.checked ? chosen.add(k) : chosen.delete(k);
    MOCK.settings.autoLinkTargets = [...chosen];
  };
  MOCK.settings.autoLinkTargets = [...chosen];
}

function dialogLink(name) {
  const sk = MOCK.skills.find((x) => x.name === name);
  const chosenAgents = new Set(sk.linkChoices || []);
  const chosenProjects = new Set(sk.scopeProjects || []);   // 空 = 全局
  const apply = () => { sk.linkChoices = [...chosenAgents]; sk.scopeProjects = [...chosenProjects]; };
  openDialog({
    title: `接入设置 · ${name}`,
    body: `
      <p class="note"><b>DSH 始终可用</b>（由本插件直接提供，不需要链接）；下面是其他 Agent。<br>
      勾选后会在那个 Agent 的 <code>skills</code> 目录里放一个指向本机技能真身的<b>软链接</b>（<code>ln -s</code>），不复制内容、不改文件。</p>
      ${MOCK.agents.filter((a) => a.exists).map((a) => {
        const fixed = !!a.fixed;
        const checked = fixed || chosenAgents.has(a.key);
        return `<label class="agent ${fixed ? "fixed" : ""}">
          <input type="checkbox" data-agent="${esc(a.key)}" ${checked ? "checked" : ""} ${fixed ? "disabled" : ""}>
          <span>${esc(a.label)}</span>
          ${fixed ? `<span class="tag">必选</span>` : ""}
          <span class="dir">${esc(a.dir)}</span>
        </label>`;
      }).join("")}
      <div class="projbox">
        <div class="projbox-title">作用范围（链接写在哪）</div>
        <label class="agent"><input type="radio" name="scope" value="global" data-scope ${chosenProjects.size === 0 ? "checked" : ""}>
          <span>全局（默认）</span></label>
        <label class="agent"><input type="radio" name="scope" value="projects" data-scope ${chosenProjects.size > 0 ? "checked" : ""}>
          <span>仅以下项目（可多选）</span></label>
        <div id="proj-list" style="${chosenProjects.size === 0 ? "opacity:.45" : ""}">
          ${MOCK.projects.map((pr) => `<label class="agent" style="padding-left:22px">
            <input type="checkbox" data-proj="${esc(pr.path)}" ${chosenProjects.has(pr.path) ? "checked" : ""} ${chosenProjects.size === 0 ? "disabled" : ""}>
            <span>${esc(pr.label)}</span><span class="dir">${esc(pr.path)}</span>
          </label>`).join("")}
        </div>
        <div class="hint">「仅项目」= <b>只在这些项目根写链接、不写全局链</b>（原生多根 + rank 优先：项目 100 &gt; 全局 400）。</div>
      </div>`,
    foot: `<button class="btn" data-close>取消</button><button class="btn btn-primary" data-do-link="${esc(name)}">保存</button>`,
  });
  $("#dlg-body").onchange = (e) => {
    const t = e.target;
    if (t.dataset.agent !== undefined) { t.checked ? chosenAgents.add(t.dataset.agent) : chosenAgents.delete(t.dataset.agent); apply(); return; }
    if (t.dataset.scope) {
      const picked = document.querySelector('input[name="scope"]:checked');
      if (picked && picked.value === "global") { chosenProjects.clear(); apply(); dialogLink(name); }
      else if (chosenProjects.size === 0) { toast("请至少勾一个项目", "err"); apply(); dialogLink(name); }
      return;
    }
    if (t.dataset.proj !== undefined) { t.checked ? chosenProjects.add(t.dataset.proj) : chosenProjects.delete(t.dataset.proj); apply(); }
  };
  apply();
}

function dialogDelete(name) {
  const s = MOCK.skills.find((x) => x.name === name);
  const blocked = s && s.blockedBy;
  const steps = `
      <ol class="steps">
        <li>断开本插件为它建的链接（DSH 等）</li>
        <li>把技能目录备份到回收站（保留 7 天）</li>
        <li>调用 <code>skills remove</code> 卸载真身与各 Agent 目录中的条目</li>
      </ol>
      <p class="note"><b>不会删除你的源仓库</b>，也不影响订阅记录。</p>`;
  const body = blocked
    ? `<div class="banner err" style="margin-bottom:10px">
         <span><b>已中止</b>：${esc(blocked.agent)} 的 <code>${esc(blocked.dir)}</code> 是一个${esc(blocked.kind)}，不是本插件创建的。
         继续删除会让 <code>skills remove</code> 把它一起删掉。</span>
       </div>
       <p class="note">请先自行移走或改名那个目录，再回来删除；或者只断开本插件建的链接（在「接入设置」里操作）。</p>`
    : steps;
  openDialog({
    title: blocked ? `无法删除 ${name}` : `删除 ${name}？`,

      ? `<button class="btn" data-close>知道了</button>`

}

/* ============================ 交互 ============================ */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  const subRow = e.target.closest("[data-sub]");
  const d = btn?.dataset || {};

  if (e.target.closest("[data-close]")) return closeDialog();

  if (d.copy !== undefined) { navigator.clipboard?.writeText(d.copy); toast("已复制：" + d.copy); return; }

  /* tab 切换 */
  if (d.tab) { ui.tab = d.tab; ui.openSub = null; render(); return; }
  /* 分组视图切换（纯视觉） */
  if (d.group) { ui.groupBy = d.group; render(); return; }

  /* 订阅展开 */
  if (subRow && !btn) {
    ui.openSub = ui.openSub === subRow.dataset.sub ? null : subRow.dataset.sub;
    render();
    return;
  }

  /* 启停开关（checkbox change 走单独监听） */
  /* 底部自动链接设置 */
  if (e.target.closest("[data-autolink]")) return dialogAutoLink();

  /* 更新 */
  if (d.update !== undefined) {
    if (!guard("更新")) return;
    const name = d.update;
    const sk = MOCK.skills.find((x) => x.name === name);
    // 本地已改 → 先确认，再更新（不再用「覆盖更新」这个第二标签）
    if (sk && sk.state === "modified") { dialogUpdateConfirm(name); return; }
    ui.busy.add(name); render();
    setTimeout(() => {
      ui.busy.delete(name);
      const s = MOCK.skills.find((x) => x.name === name);
      if (s && s.state === "error") {
        // 演示失败已回滚
        toast(`${name} 更新失败，已回滚到 ${s.from || "a1b2c3d"}`, "err", "详情");
      } else {
        const to = s && s.to;
        if (s) { s.state = "current"; delete s.from; delete s.to; }
        // 订阅里的「有新版本」标记同步清掉
        MOCK.subscriptions.forEach((sub) => sub.skills.forEach((k) => { if (k.name === name) k.hasUpdate = false; }));
        toast(`${name} 已更新${to ? "到 " + to : ""} · 改动 7 个文件 · 备份 b7c8`, "ok");
      }
      render();
    }, 900);
    return;
  }
  if (d.forceUpdate) {
    if (!guard("更新")) return;
    const name = d.forceUpdate;
    closeDialog();
    ui.busy.add(name); render();
    setTimeout(() => {
      ui.busy.delete(name);
      const s = MOCK.skills.find((x) => x.name === name);
      const to = s && s.to;
      if (s) { s.state = "current"; delete s.from; delete s.to; }
      MOCK.subscriptions.forEach((sub) => sub.skills.forEach((k) => { if (k.name === name) k.hasUpdate = false; }));
      render();
      toast(`${name} 已更新${to ? "到 " + to : ""}（本地改动已备份，可回滚）`, "ok");
    }, 900);
    return;
  }

  if (d.updateAll !== undefined || e.target.closest("[data-update-all]")) {
    if (!guard("批量更新")) return;
    MOCK.skills.forEach((s) => { if (s.state === "update") { ui.busy.add(s.name); } });
    render();
    setTimeout(() => {
      ui.busy.clear();
      MOCK.skills.forEach((s) => {
        if (s.state !== "update") return;
        s.state = "current"; delete s.from; delete s.to;
        MOCK.subscriptions.forEach((sub) => sub.skills.forEach((k) => { if (k.name === s.name) k.hasUpdate = false; }));
      });
      toast("已更新 1 个技能（其余已是最新）", "ok");
      render();
    }, 1100);
    return;
  }

  /* 默认链接范围：保存 */
  if (d.doAutolink) {
    closeDialog(); render();
    const names = [...new Set(MOCK.settings.autoLinkTargets.map((k) => AGENT_LABEL[k] || k))];
    toast(`之后安装会链接到：${names.join("、")}`, "ok");
    return;
  }

  /* 接入 */
  if (d.link) return dialogLink(d.link);
  if (d.doLink) {
    if (!guard("接入设置")) return;
    const s = MOCK.skills.find((x) => x.name === d.doLink);
    const before = new Set(s.linked);
    const next = s.linkChoices || [];
    const added = next.filter((k) => !before.has(k));
    const removed = [...before].filter((k) => !next.includes(k) && !k.startsWith("project:"));
    const scopeProjects = s.scopeProjects || [];
    // 全局 → 必须含 dsh-global；仅项目 → 摘掉 dsh-global（不写全局链），项目链由 scopeProjects 记着
    const withDsh = scopeProjects.length
      ? next.filter((k) => k !== "dsh-global")
      : [...new Set(["dsh-global", ...next])];
    s.linked = withDsh;
    closeDialog(); render();
    const scope = (s.scopeProjects || []).length
      ? `范围：仅 ${s.scopeProjects.map(projLabel).join("、")}`
      : "范围：全局";
    const parts = [];
    if (added.length) parts.push(`新增链接 ${added.map((k) => AGENT_LABEL[k] || k).join("、")}`);
    if (removed.length) parts.push(`移除链接 ${removed.map((k) => AGENT_LABEL[k] || k).join("、")}`);
    toast(`${s.name} 已保存（${[scope, ...parts].join("；")}）`, "ok");
    return;
  }

  /* 删除 */
  if (d.del) return dialogDelete(d.del);
  if (d.doDel) {
    if (!guard("删除")) return;
    MOCK.skills = MOCK.skills.filter((x) => x.name !== d.doDel);
    closeDialog(); render();
    toast(`已删除 ${d.doDel}（备份在回收站，保留 7 天）`, "ok");
    return;
  }

  /* 订阅内安装 / 刷新 / 展开 */
  if (d.install) {
    if (!guard("安装")) return;
    const name = d.install;
    // 在订阅里标记为已装，并加入技能列表
    MOCK.subscriptions.forEach((sub) => sub.skills.forEach((k) => { if (k.name === name && k.state === "idle") k.state = "installed"; }));
    if (!MOCK.skills.some((x) => x.name === name)) {
      const auto = [...MOCK.settings.autoLinkTargets];
      MOCK.skills.unshift({ name, source: "morehao/ai-kit", commit: "a1b2c3d", state: "current", mode: "on", linked: auto, linkChoices: auto });
    }
    render();
    toast(`已安装 ${name}（还没有 Agent 能用它，可点「链接到 Agent…」）`, "ok");
    return;
  }
  if (d.delSub) return dialogDeleteSub(d.delSub);
  if (d.doDelSub) {
    if (!guard("删除订阅")) return;
    const sub = MOCK.subscriptions.find((x) => x.id === d.doDelSub);
    const kept = sub ? sub.skills.filter((k) => k.state === "installed").length : 0;
    MOCK.subscriptions = MOCK.subscriptions.filter((x) => x.id !== d.doDelSub);
    closeDialog();
    if (ui.openSub === d.doDelSub) ui.openSub = null;
    render();
    toast(`已删除订阅${sub ? " " + sub.source : ""}（${kept} 个已装技能保留）`, "ok");
    return;
  }
  if (d.refresh) { toast(ui.scenario === "offline" ? "当前离线，只能看上次快照" : "快照已刷新", ui.scenario === "offline" ? "err" : "ok"); return; }

  /* 顶部按钮 */
  if (e.target.closest("[data-add-skill]")) return dialogAddSkill();
  if (e.target.closest("[data-add-sub]")) return dialogAddSub();
  if (d.doAddSkill) {
    if (!guard("安装")) return;
    const src = $("#f-source")?.value.trim() || "owner/repo#skill";
    const skill = $("#f-skill")?.value.trim();
    closeDialog();
    const auto = [...MOCK.settings.autoLinkTargets];
    MOCK.skills.unshift({ name: skill || "new-skill", source: src.split("#")[0] || src, commit: "a1b2c3d", state: "current", mode: "on", linked: auto, linkChoices: auto });
    render();
    toast(`已安装 ${skill || "new-skill"}（还没有 Agent 能用它）`, "ok");
    return;
  }
  if (d.doAddSub) {
    if (!guard("添加订阅")) return;
    const repo = $("#f-repo")?.value.trim() || "owner/repo";
    const ref = $("#f-ref")?.value.trim() || "main";
    closeDialog();
    MOCK.subscriptions.unshift({ id: "s" + Date.now(), source: repo, ref, skills: [] });
    render();
    toast(`已添加订阅 ${repo}（未安装任何技能）`, "ok");
    return;
  }
});

document.addEventListener("change", (e) => {
  const name = e.target.dataset?.mode;
  if (!name) return;
  if (!guard("启停")) { render(); return; }   // 只读/离线时回滚 UI
  const s = MOCK.skills.find((x) => x.name === name);
  if (!s) return;
  s.mode = e.target.checked ? "on" : "off";
  render();
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDialog(); });
$("#scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeDialog(); });
$("#scenario").addEventListener("change", (e) => { ui.scenario = e.target.value; ui.openSub = null; render(); });
$("#theme").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
});

render();
</script>
</body>
</html>
